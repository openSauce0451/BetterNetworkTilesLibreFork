import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose" version "$kotlin_version"
}

android {
    compileSdkVersion 37
    ndkVersion "27.0.11878342"
    defaultConfig {
        applicationId "be.casperverswijvelt.unifiedinternetqs"
        targetSdkVersion 37
        compileSdk 36
        minSdkVersion 32
        versionCode 3020000
        versionName "3.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Disables dependency metadata
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    flavorDimensions = ["distribution"]
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_11
        }
    }
    namespace 'be.casperverswijvelt.unifiedinternetqs'

    buildFeatures {
        compose = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.11"
    }
    androidResources {
        generateLocaleConfig = true
    }
}
repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
}
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.core:core-ktx:1.18.0"
    implementation "com.google.android.material:material:1.13.0"
    implementation "androidx.preference:preference-ktx:1.2.1"

    // Compose UI
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.animation:animation:1.11.0'
    implementation 'androidx.compose.ui:ui-tooling:1.11.0'
    implementation "androidx.compose.material3:material3:1.4.0"
    implementation "androidx.navigation:navigation-compose:2.9.8"
    implementation "androidx.compose.material:material-icons-extended:1.7.8"

    // App restarting
    implementation "com.jakewharton:process-phoenix:3.0.0"

    // Preferences DataStore
    implementation "androidx.datastore:datastore-preferences:1.2.1"

    // SU
    implementation "com.github.topjohnwu.libsu:core:5.0.3"

    // Shizuku
    def shizuku_version = "13.1.5"
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"
}

configurations {
    configureEach {
        exclude group: "androidx.lifecycle", module: "lifecycle-viewmodel-ktx"
    }
}
